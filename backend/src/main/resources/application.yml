spring:
  application:
    name: garrizon-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://gldz3.dailyrazor.com:3306/royalsee_garrizon?useSSL=false&allowPublicKeyRetrieval=true
    username: royalsee_gzon_user
    password: "G@rr1z0n+DB+P@55w0rd"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  # context-path removed to avoid double /api prefix when deployed as ROOT.war

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:garrizon-super-secret-key-change-this-in-production-minimum-256-bits}
  access-token-expiration: 900000 # 15 minutes
  refresh-token-expiration: 604800000 # 7 days

# Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Stripe
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  public-key: ${STRIPE_PUBLIC_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

# Paystack
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  public-key: ${PAYSTACK_PUBLIC_KEY:}

# Resend
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@garrizon.com}
  from-name: Garrizon

# CORS (Managed by CorsConfig.java now, but keeping clean defaults)
cors:
  allowed-origins: https://garrizon.com,https://www.garrizon.com,http://localhost:5173,http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Springdoc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    com.garrizon: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

scheduler:
  abandoned-cart:
    enabled: true
    cron: "0 0 */2 * * *"
    inactivity-threshold-hours: 1
